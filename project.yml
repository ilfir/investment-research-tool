# Xcode project definition. After adding/removing source files run:  xcodegen generate
name: TickerEvaluator
options:
  bundleIdPrefix: local.tickerevaluator
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  TickerEvaluator:
    type: application
    platform: macOS
    sources:
      - path: TickerEvaluator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tickerevaluator.app
        PRODUCT_NAME: TickerEvaluator
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ticker Evaluator
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lsqlite3"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TickerEvaluatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TickerEvaluatorTests
        excludes: ["Fixtures/**"]   # read from disk via #filePath, not bundled
    dependencies:
      - target: TickerEvaluator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tickerevaluator.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TickerEvaluator.app/Contents/MacOS/TickerEvaluator"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TickerEvaluator:
    build:
      targets:
        TickerEvaluator: all
        TickerEvaluatorTests: [test]
    test:
      targets:
        - TickerEvaluatorTests
